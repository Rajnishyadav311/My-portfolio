<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box model</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
    }
    .box{
        background-color:aqua ;
    }
    .box1{
        color: yellow;
        padding: 10px;
        margin: 20px;
        height: 150px;
        border: 2px solid blue;
        box-sizing: border-box;       

    }
    .box2{
        color: red;
        padding: 10px;
        margin: 15px;
        height: 150px;
        border: 2px solid red;
        box-sizing: border-box;

    }
</style>
<body>
    <div class="box , box1">
        I am a box 
    </div>
    <div class="box , box2">
        I am another box
    </div>
</body>
</html>
