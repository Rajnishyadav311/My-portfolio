<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms - lets learn </title>
</head>
<body>
    <h1>Form to apply for Sigma Web Development course - TA </h1>
    <form action="post ">
        <div>
            <label for="username">Enter your user name </label>
            <input type="text" id="username" name="username" placeholder="Enter your username">
        </div>
        <div>
            <input type="radio" id="male" name="gender" value="male" autofocus>
            <label for="male">male</label>
              <input type="radio" id="Female" name="gender" value="female"autofocus>
            <label for="Female">Female</label>
        </div>
        <div>
            <input type="checkbox" id="subscribe" name="subscribe">
            <label for="subscribe">Subsv=cribe to newsletter</label>
        </div>
        <div>
            <label for="comment">Enter your comment </label>
            <textarea name="comment" id="comment" rows="5" cols="50"></textarea>
        </div>
          <div>
               <select name="fruits">
                <option value="apple">Apple</option>
                <option value="banana">Banana</option>
                <option value="cherry">Cherry</option>
          </select>
          </div>
    </form>
</body>
</html>
